name: MalayalamLearning
options:
  bundleIdPrefix: com.sibin
targets:
  MalayalamLearning:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Components
      - path: Data
      - path: Screens
      - path: ViewModels
      - path: Raw
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sibin.MalayalamLearning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_NAME: Malayalam Learning
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1,2
